# Explicitly selected owned proof only; no real endpoints or published ports.
services:
  test-runner:
    environment:
      FEISHU_WEBHOOK_URL: ""
      FEISHU_WEBHOOK_SECRET: ""
    command:
      - >-
        import subprocess,sys;
        subprocess.run([sys.executable,'-m','alembic','upgrade','head'],check=True);
        subprocess.run([sys.executable,'-m','alembic','check'],check=True);
        subprocess.run([sys.executable,'app/initial_data.py'],check=True);
        subprocess.run([sys.executable,'scripts/check-notification-composition.py'],check=True)
