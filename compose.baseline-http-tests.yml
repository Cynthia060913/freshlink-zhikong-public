# Owned temporary HTTP proof only; no app service, host ports or durable volume.
services:
  test-db:
    image: postgres:18
    environment:
      POSTGRES_USER: freshlink_test
      POSTGRES_PASSWORD: a01_disposable_only
      POSTGRES_DB: freshlink_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshlink_test -d freshlink_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  test-runner:
    image: ${BASELINE_APP_IMAGE:-freshlink-app:p0}
    working_dir: /app/backend
    environment:
      PROJECT_NAME: FreshLink-test
      FASTAPI_ENV: development
      SECRET_KEY: a01-disposable-test-key-only-32-characters
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: a01-disposable-admin-only
      DATABASE_URL: postgresql://freshlink_test:a01_disposable_only@test-db:5432/freshlink_test
      SMTP_HOST: ""
      EMAILS_FROM_EMAIL: ""
      SENTRY_DSN: ""
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /app/backend
      BASELINE_SOURCE_COMMIT: ${BASELINE_SOURCE_COMMIT:?Use the owned wrapper}
      BASELINE_SOURCE_DIRTY: ${BASELINE_SOURCE_DIRTY:?Use the owned wrapper}
      BASELINE_PROOF_SCOPE: ${BASELINE_PROOF_SCOPE:-candidate}
      BASELINE_PROOF_ACTOR: ${BASELINE_PROOF_ACTOR:-local}
    volumes:
      - ./backend:/app/backend:ro
      - ${BASELINE_RESULT_DIR:?Use the owned wrapper}:/results
    entrypoint: ["bash", "-c"]
    command: ["set -e; alembic upgrade head; python app/initial_data.py; python scripts/check-baseline-http.py"]
networks:
  default:
    internal: true
