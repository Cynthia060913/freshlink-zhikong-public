name: Test A C Telemetry Integration

on:
  pull_request:
    paths:
      - backend/app/modules/iot/**
      - backend/migration_candidates/**
      - backend/tests/api/routes/test_transport_migration_candidate.py
      - backend/Dockerfile
      - backend/pyproject.toml
      - backend/scripts/check-telemetry-mqtt.py
      - backend/scripts/check-telemetry-inbox.py
      - backend/scripts/check-telemetry-restart.py
      - backend/scripts/check-device-events-mqtt.py
      - uv.lock
      - scripts/windows/check-telemetry-mqtt.ps1
      - scripts/windows/check-telemetry-restart.ps1
      - scripts/windows/telemetry-restart-guards.ps1
      - scripts/windows/test-telemetry-restart-guards.ps1
      - scripts/windows/check-device-events-mqtt.ps1
      - scripts/windows/device-event-evidence.ps1
      - scripts/windows/test-device-event-evidence.ps1
      - scripts/mqtt-runtime/**
      - compose.telemetry-integration-tests.yml
      - compose.telemetry-restart-tests.yml
      - compose.device-event-tests.yml
      - compose.a01-tests.yml
      - scripts/windows/check-a01-acceptance.ps1
      - .github/workflows/test-telemetry-integration.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a-c-telemetry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a-c-telemetry-mqtt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public candidate and pinned source objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify synthetic-only ownership guards
        shell: pwsh
        run: |
          ./scripts/windows/test-telemetry-restart-guards.ps1
          ./scripts/windows/test-device-event-evidence.ps1
      - name: Build disposable application image
        run: docker build --file backend/Dockerfile --tag freshlink-app:p0 .
      - name: Prepare test-only service images on disposable runner
        run: |
          docker pull postgres:18
          docker pull eclipse-mosquitto@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
      - name: Run strict disposable transport migration PG proof
        shell: pwsh
        env:
          REVIEWED_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $before = @(Get-ChildItem -LiteralPath ./work -Directory -Filter 'a01-tests-*' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
          ./scripts/windows/check-a01-acceptance.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Strict disposable backend/PG proof failed' }
          $created = @(Get-ChildItem -LiteralPath ./work -Directory -Filter 'a01-tests-*' | Where-Object { $_.FullName -notin $before })
          if ($created.Count -ne 1) { throw 'Cannot identify exactly one owned proof result' }
          $report = Join-Path $created[0].FullName 'pytest.xml'
          [xml]$junit = Get-Content -LiteralPath $report -Raw
          $cases = @($junit.SelectNodes("//testcase[@name='test_actual_postgres_candidate_roundtrip_and_cleanup']"))
          if ($cases.Count -ne 1 -or $cases[0].SelectNodes('failure|error|skipped').Count -ne 0) {
            throw 'Actual PG migration case did not execute successfully; skip is not acceptance'
          }
          $actual = (& git rev-parse HEAD).Trim()
          if ($actual -notmatch '^[0-9a-f]{40}$' -or $env:REVIEWED_PR_HEAD -notmatch '^[0-9a-f]{40}$') { throw 'Missing source identity' }
          @{ proof='actual_transport_pg_case_executed'; executed_source=$actual; pr_head=$env:REVIEWED_PR_HEAD; junit_sha256=(Get-FileHash -LiteralPath $report -Algorithm SHA256).Hash } | ConvertTo-Json -Compress
      - name: Run private-network MQTT A C and owned-container recovery proof
        shell: pwsh
        run: ./scripts/windows/check-telemetry-restart.ps1
      - name: Run private-network continuous A B event-delivery proof
        shell: pwsh
        run: ./scripts/windows/check-device-events-mqtt.ps1
