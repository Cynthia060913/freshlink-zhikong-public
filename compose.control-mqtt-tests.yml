# Disposable control proof. No host ports, app volume or external notifications.
services:
  test-db:
    image: postgres:18
    environment:
      POSTGRES_USER: freshlink_test
      POSTGRES_PASSWORD: a01_disposable_only
      POSTGRES_DB: freshlink_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshlink_test -d freshlink_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  broker:
    image: eclipse-mosquitto@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
    entrypoint: ["sh", "/fixtures/start.sh"]
    volumes:
      - ./scripts/mqtt-runtime:/fixtures:ro
  test-runner:
    image: ${CONTROL_MQTT_APP_IMAGE:-freshlink-app:p0}
    working_dir: /app/backend
    environment:
      PROJECT_NAME: FreshLink-test
      FASTAPI_ENV: development
      SECRET_KEY: a01-disposable-test-key-only-32-characters
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: a01-disposable-admin-only
      DATABASE_URL: postgresql://freshlink_test:a01_disposable_only@test-db:5432/freshlink_test
      SMTP_HOST: ""
      EMAILS_FROM_EMAIL: ""
      SENTRY_DSN: ""
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /app/backend
    volumes:
      - ./backend:/app/backend:ro
      - ${CONTROL_MQTT_RESULT_DIR:?Use check-control-mqtt.ps1}:/results
    depends_on:
      test-db:
        condition: service_healthy
      broker:
        condition: service_started
    entrypoint: ["bash", "-c"]
    command: ["set -e; alembic upgrade head; python app/initial_data.py; python scripts/check-control-mqtt.py"]
networks:
  default:
    internal: true
