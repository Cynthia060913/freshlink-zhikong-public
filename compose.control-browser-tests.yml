# Opt-in test only: no original DB/credentials; only a random LOOPBACK HTTP port.
services:
  test-db:
    image: postgres:18
    environment:
      POSTGRES_USER: freshlink_test
      POSTGRES_PASSWORD: a01_disposable_only
      POSTGRES_DB: freshlink_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshlink_test -d freshlink_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  broker:
    image: eclipse-mosquitto@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
    entrypoint: ["sh", "/fixtures/start.sh"]
    volumes:
      - ./scripts/mqtt-runtime:/fixtures:ro
  test-runner:
    image: ${CONTROL_BROWSER_APP_IMAGE:-freshlink-app:p0}
    working_dir: /tmp
    environment:
      PROJECT_NAME: FreshLink-test
      FASTAPI_ENV: development
      SECRET_KEY: a01-disposable-test-key-only-32-characters
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: a01-disposable-admin-only
      DATABASE_URL: postgresql://freshlink_test:a01_disposable_only@test-db:5432/freshlink_test
      SMTP_HOST: ""
      EMAILS_FROM_EMAIL: ""
      SENTRY_DSN: ""
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /tmp/backend
      CONTROL_BROWSER_SOURCE: ${CONTROL_BROWSER_SOURCE:?Use check-live-control-browser.ps1}
    volumes:
      - ./backend:/source-backend:ro
      - ${CONTROL_BROWSER_BUNDLE:?Use check-live-control-browser.ps1}:/frontend-bundle:ro
      - ${CONTROL_BROWSER_RESULTS:?Use check-live-control-browser.ps1}:/results
    ports:
      - target: 8000
        host_ip: 127.0.0.1
        published: "0"
    networks:
      - default
      - browser-edge
    entrypoint: ["bash", "-c"]
    command:
      - set -e; cp -a /source-backend /tmp/backend; ln -s /frontend-bundle /tmp/backend/app/frontend; cd /tmp/backend; python scripts/check-live-control-browser.py --preflight; alembic upgrade head; python app/initial_data.py; python scripts/check-live-control-browser.py
networks:
  default:
    internal: true
  # Docker's internal-only bridge does not publish ports to a host browser.
  # Only the runner joins this extra bridge; PG/MQTT remain internal-only.
  # SMTP/Sentry are explicitly disabled and the browser blocks other origins.
  browser-edge:
    driver: bridge
